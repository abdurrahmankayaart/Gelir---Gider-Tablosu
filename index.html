<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kese">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<!-- APP START -->
<title>Kese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#EFF1F4; --ink:#15181E; --ink-2:#4B5261; --muted:#7D8494; --line:#E4E7EC;
  --accent:#12805C; --on-accent:#FFFFFF; --accent-soft:#DDF2E8; --ring:#12805C;
  --in:#1baf7a; --out:#eb6834; --save:#4a3aa7;
  --good:#0B7A3B; --good-soft:#DDF3E4; --warn:#8F5B00; --warn-soft:#FCEFCF; --bad:#C0322B; --bad-soft:#FBE0DE;
  --grid:#E8EAEE; --axis:#C5CAD3; --shadow:0 1px 2px rgba(21,24,30,.05),0 6px 20px rgba(21,24,30,.06); --scrim:rgba(12,14,18,.42);
  --tint:13%; --tint-2:24%;
  --display:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1113; --surface:#181B1F; --surface-2:#22262B; --ink:#F2F4F6; --ink-2:#C4C9D1; --muted:#8B919B; --line:#2A2E34;
    --accent:#3DDC97; --on-accent:#0B1F17; --accent-soft:#16352A; --ring:#3DDC97;
    --in:#199e70; --out:#d95926; --save:#9085e9;
    --good:#4CCB6A; --good-soft:#143020; --warn:#F0B443; --warn-soft:#3A2D12; --bad:#EF6B6B; --bad-soft:#3A1A1A;
    --grid:#24282D; --axis:#3A3F46; --shadow:0 1px 2px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.6);
    --tint:18%; --tint-2:30%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1113; --surface:#181B1F; --surface-2:#22262B; --ink:#F2F4F6; --ink-2:#C4C9D1; --muted:#8B919B; --line:#2A2E34;
  --accent:#3DDC97; --on-accent:#0B1F17; --accent-soft:#16352A; --ring:#3DDC97;
  --in:#199e70; --out:#d95926; --save:#9085e9;
  --good:#4CCB6A; --good-soft:#143020; --warn:#F0B443; --warn-soft:#3A2D12; --bad:#EF6B6B; --bad-soft:#3A1A1A;
  --grid:#24282D; --axis:#3A3F46; --shadow:0 1px 2px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.6);
  --tint:18%; --tint-2:30%;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);overscroll-behavior-y:none}
body{font-family:var(--body);color:var(--ink);font-size:15px;line-height:1.45;padding-inline:16px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:10px}
.app{max-width:560px;margin-inline:auto;padding-bottom:128px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;margin-inline:-16px;padding-inline:16px}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand svg{width:28px;height:28px}
.month{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{border:0;background:none;width:34px;height:34px;border-radius:999px;display:grid;place-items:center;color:var(--ink-2)}
.month span{min-width:98px;text-align:center;font-weight:700;font-size:14px}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}

#view{display:flex;flex-direction:column;gap:18px}
#view.enter{animation:enter .28s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-h .sub{font-size:13px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:13.5px;padding:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.dark{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--surface-2);color:var(--ink-2)}
.hint{font-size:13px;color:var(--muted);margin:0}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:14px}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}

/* category tint */
[style*="--c"]{--c-bg:color-mix(in srgb,var(--c) var(--tint),var(--surface));--c-bub:color-mix(in srgb,var(--c) var(--tint-2),var(--surface))}
.bub{width:38px;height:38px;border-radius:13px;background:var(--c-bub,var(--surface-2));display:grid;place-items:center;font-size:19px;flex:none}

/* hero */
.hero{padding-top:4px}
.hello{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;color:var(--ink-2);font-size:15px}
.streak{background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:12.5px;border-radius:99px;padding:3px 10px}
.big{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.02;letter-spacing:-.03em;margin-top:10px}
.big.neg{color:var(--bad)}
.hero .sub{color:var(--muted);font-size:14px;margin-top:2px}
.split{display:flex;gap:3px;height:12px;margin-top:16px}
.split i{display:block;height:100%;border-radius:6px;min-width:0}
.split-l{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.split-l span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.io .card{padding:12px 14px;border-radius:18px}
.io small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;font-weight:600}
.io b{display:block;font-family:var(--display);font-size:21px;font-weight:700;margin-top:2px}
.io em{font-style:normal;font-size:12px;color:var(--muted)}

/* quick text */
.qin{display:flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:5px 5px 5px 14px;box-shadow:var(--shadow)}
.qin:focus-within{border-color:var(--accent)}
.qin input{flex:1;min-width:0;border:0;background:none;font-size:16px;padding:8px 0;outline:none}
.qin input::placeholder{color:var(--muted)}
.qbtn{border:0;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);flex:none}
.qbtn.go{background:var(--accent);color:var(--on-accent)}
.qbtn.rec{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--bad) 20%,transparent)}}
.qprev{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center;font-size:13px}
.qprev:empty{display:none}
.qprev .tag{background:var(--c-bg,var(--surface-2));border-radius:99px;padding:4px 10px;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.qprev .tag.amt{background:var(--ink);color:var(--bg)}
.qhelp{font-size:12.5px;color:var(--muted);margin-top:8px}

/* templates */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-bottom:2px;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.qchip{flex:none;border:0;background:var(--c-bg);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:96px;text-align:left;scroll-snap-align:start;transition:transform .12s}
.qchip:active{transform:scale(.95)}
.qchip .ic{font-size:22px;line-height:1}
.qchip b{display:block;font-size:13.5px;font-weight:700;white-space:nowrap}
.qchip small{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap}
.qchip.add{background:none;border:1.5px dashed var(--line);color:var(--ink-2);font-weight:700;font-size:13px;justify-content:center;align-items:center}

/* budget ring card */
.ringcard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring span{position:absolute;font-family:var(--display);font-weight:800;font-size:15px}
.ringcard .v{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.02em}
.ringcard .s{color:var(--muted);font-size:13px}

/* goals strip */
.gmini{flex:none;width:156px;border:0;background:var(--c-bg);border-radius:20px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start}
.gmini .top2{display:flex;justify-content:space-between;align-items:center}
.gmini b{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gmini small{font-size:12px;color:var(--ink-2)}
.gmini .bar{height:6px;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.gmini .bar i{background:var(--c)}

/* fixed + lists */
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font-weight:700;font-size:14.5px}
.li .m{font-size:12.5px;color:var(--muted)}
.li.done .t{color:var(--muted)}
.check{color:var(--good);font-weight:700;font-size:13px}

/* category grid */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ccard{border:0;background:var(--c-bg);border-radius:20px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.ccard .h{display:flex;justify-content:space-between;align-items:flex-start}
.ccard .pct{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--surface);border-radius:99px;padding:2px 8px}
.ccard .n{font-size:13px;font-weight:600;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccard .a{font-family:var(--display);font-size:19px;font-weight:700;margin-top:-4px}
.ccard .bar{height:6px;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.ccard .bl{font-size:11.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap}
.more{grid-column:1/-1}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:14px;height:0;border-top:2px dashed var(--ink-2);display:inline-block}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--body)}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:10px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));box-shadow:var(--shadow)}

.cta{display:flex;align-items:center;gap:14px;border:0;width:100%;text-align:left;background:var(--ink);color:var(--bg);border-radius:22px;padding:16px}
.cta .ic{font-size:28px}
.cta b{display:block;font-family:var(--display);font-size:17px}
.cta small{opacity:.75;font-size:13px}
.cta svg{margin-left:auto;flex:none}

.banner{background:var(--warn-soft);border-radius:20px;padding:14px;font-size:14px;display:flex;flex-direction:column;gap:10px}
.banner b{color:var(--warn)}

/* list view */
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 12px;font-size:16px}
.inp:focus{outline:2px solid var(--ring);outline-offset:0;border-color:transparent}
.segs{display:flex;gap:6px;flex-wrap:wrap}
.seg-b{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seg-b[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.day-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;padding:14px 4px 6px;text-transform:uppercase;letter-spacing:.05em}
.txg{border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.txw{position:relative;background:var(--bad);border-bottom:1px solid var(--line)}
.txw:last-child{border-bottom:0}
.txw .del{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:#fff;font-weight:700;font-size:13px}
.tx{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;border:0;background:var(--surface);padding:11px 14px;text-align:left;touch-action:pan-y}
.tx .t{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .m{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-weight:700;font-size:15px;text-align:right;font-family:var(--display)}
.tx .a.in{color:var(--good)}
.tx .badge{font-size:10.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2);border-radius:6px;padding:1px 6px;margin-left:6px}

/* budget view */
.bud{display:grid;grid-template-columns:auto 1fr 118px;gap:8px 12px;align-items:center;padding-block:11px;border-top:1px solid var(--line)}
.bud:first-child{border-top:0}
.bud .n{font-weight:700;font-size:14.5px}
.bud .m{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.bud .bar{grid-column:2/-1;height:6px}
.money-in{position:relative}
.money-in input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:9px 10px 9px 24px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:16px}
.money-in::before{content:"₺";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}

/* goals view */
.goal{background:var(--c-bg);border:0;display:flex;flex-direction:column;gap:10px}
.goal .gt{display:flex;gap:12px;align-items:center}
.goal .gt .bub{background:var(--surface);width:46px;height:46px;font-size:24px;border-radius:15px}
.goal .gt .m{font-size:12.5px;color:var(--ink-2)}
.goal .ga{font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.02em}
.goal .ga small{font-size:15px;color:var(--ink-2);font-weight:600}
.goal .bar{height:10px;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.goal .bar i{background:var(--c)}
.goal .plan{font-size:13px;color:var(--ink-2)}
.goal .btn{background:var(--surface);border-color:transparent}

/* settings */
.set-i{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.set-i:first-child{border-top:0}
.set-i .t{font-weight:700;font-size:14.5px}
.set-i .m{font-size:12.5px;color:var(--muted)}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prof{border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.prof[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.prof .ic{font-size:24px}
.prof b{font-size:14.5px}
.prof small{font-size:12.5px;color:var(--muted);line-height:1.35}
textarea.inp{min-height:110px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:1fr 1fr 80px 1fr 1fr;align-items:center;height:64px;padding-inline:8px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;padding-block:6px;-webkit-user-select:none;user-select:none}
.nav a svg{width:23px;height:23px;transition:transform .15s}
.nav a[aria-current="page"]{color:var(--accent)}
.nav a[aria-current="page"] svg{transform:translateY(-1px) scale(1.06)}
.fab{justify-self:center;width:60px;height:60px;border-radius:22px;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transform:translateY(-16px);box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .15s}
.fab:active{transform:translateY(-16px) scale(.94)}
.fab svg{width:28px;height:28px}

/* sheets */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.panel{position:relative;width:100%;max-width:560px;max-height:94%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:28px 28px 0 0;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .3s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(100%)}}
.grabzone{position:sticky;top:0;z-index:2;background:var(--surface);padding:10px 0 4px;touch-action:none;cursor:grab;display:flex;flex-direction:column;gap:10px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);align-self:center}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:3px;flex:1;max-width:240px}
.toggle button{border:0;background:none;border-radius:11px;padding:8px;font-weight:700;font-size:14px;color:var(--ink-2)}
.toggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.x{border:0;background:var(--surface-2);width:36px;height:36px;border-radius:99px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.amt{font-family:var(--display);font-weight:800;font-size:46px;text-align:center;letter-spacing:-.03em;line-height:1.1;overflow-wrap:anywhere}
.amt.zero{color:var(--muted)}
.amt.gelir{color:var(--good)}
.amt-sub{text-align:center;font-size:13px;color:var(--muted);margin-top:-8px;min-height:18px}
.catgrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:78px;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.catgrid::-webkit-scrollbar{display:none}
.catb{border:2px solid transparent;background:var(--c-bg);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--ink-2);text-align:center;line-height:1.15}
.catb .ic{font-size:22px;line-height:1}
.catb[aria-pressed="true"]{border-color:var(--c);color:var(--ink)}
.opts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.opts input[type=date],.opts select{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 10px;font-size:13px;font-weight:700;color:var(--ink-2)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keypad button{border:0;background:var(--surface-2);border-radius:16px;height:52px;font-size:23px;font-weight:700;font-family:var(--display);transition:transform .08s,background .08s}
.keypad button:active{transform:scale(.95);background:var(--line)}
.save{height:54px;border:0;border-radius:18px;background:var(--accent);color:var(--on-accent);font-weight:800;font-size:16px}
.save-row{display:flex;gap:8px}
.save-row .save{flex:1}
.err{color:var(--bad);font-size:13px;font-weight:700}
.err:empty{display:none}
.cb{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.cb input{width:18px;height:18px;accent-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700;color:var(--ink-2)}

/* report */
.rp-big{font-family:var(--display);font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rp-grid>div{background:var(--surface-2);border-radius:16px;padding:10px 12px}
.rp-grid small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.rp-grid b{font-family:var(--display);font-size:18px}
.rp-list{display:flex;flex-direction:column;gap:8px}
.rp-item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.rp-item .bar{grid-column:2/-1;height:6px}
.tipbox{background:var(--accent-soft);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.tipbox p{margin:0;display:flex;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);border-radius:16px;padding:11px 12px 11px 16px;display:flex;gap:14px;align-items:center;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px);width:max-content;animation:toastin .25s cubic-bezier(.2,.9,.25,1)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,12px)}}
.toast button{border:0;background:none;color:var(--accent);font-weight:800;white-space:nowrap}
.confetti{position:fixed;z-index:95;left:50%;top:40%;pointer-events:none;font-size:22px;animation:burst 1.1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
(() => {
'use strict';
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => dstr(new Date());
const parseD = s => new Date(s + 'T12:00:00');
const mkey = (y, m) => `${y}-${pad(m + 1)}`;
const daysIn = (y, m) => new Date(y, m + 1, 0).getDate();
const addMonths = (ds, k) => { const d = parseD(ds), t = new Date(d.getFullYear(), d.getMonth() + k, 1); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(Math.min(d.getDate(), daysIn(t.getFullYear(), t.getMonth())))}`; };
const AY = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const AYK = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const GUN = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const nf0 = new Intl.NumberFormat('tr-TR', {maximumFractionDigits: 0});
const nf2 = new Intl.NumberFormat('tr-TR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const money = (n, sign) => { const a = Math.abs(n), r = Math.round(a * 100) % 100 ? nf2.format(a) : nf0.format(Math.round(a)); return (n < 0 ? '−' : sign && n > 0 ? '+' : '') + '₺' + r; };
const kfmt = v => v >= 1000 ? (v / 1000).toLocaleString('tr-TR', {maximumFractionDigits: 1}) + 'B' : String(Math.round(v));
const niceMax = v => { const mag = Math.pow(10, Math.floor(Math.log10(v))); for (const f of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (f * mag >= v) return f * mag; return v; };
const trLow = s => String(s || '').toLocaleLowerCase('tr-TR').trim();
const cap = s => s ? s.charAt(0).toLocaleUpperCase('tr-TR') + s.slice(1) : s;
const pctOf = (a, b) => b ? Math.round(a / b * 100) : 0;
const buzz = (ms = 8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ================= categories ================= */
const BASE = {
  gider: [
    ['market','Market','🛒','#22A06B'],['yemek','Yeme-içme','🍽️','#F07C3A'],['ulasim','Ulaşım','🚌','#3B82F6'],['kira','Kira & Aidat','🏠','#8B5CF6'],
    ['fatura','Faturalar','💡','#EAB308'],['iletisim','Telefon & İnternet','📱','#06B6D4'],['abonelik','Abonelikler','📺','#EC4899'],['saglik','Sağlık','💊','#EF4444'],
    ['giyim','Giyim','👕','#A855F7'],['eglence','Eğlence','🎬','#F43F5E'],['kisisel','Kişisel bakım','💇','#D946EF'],['ev','Ev eşyası','🛋️','#B7791F'],
    ['egitim','Eğitim','📚','#0EA5E9'],['kredi','Kredi & Borç','💳','#64748B'],['hediye','Hediye','🎁','#E11D48'],['evcil','Evcil hayvan','🐾','#C2410C'],['diger','Diğer','📦','#6B7280']
  ],
  gelir: [
    ['maas','Maaş','💼','#16A34A'],['ek','Ek iş','🧾','#0D9488'],['kirag','Kira geliri','🏘️','#7C3AED'],['yatirim','Yatırım','📈','#2563EB'],['prim','Prim & İkramiye','🎉','#DB2777'],['digerg','Diğer gelir','➕','#4B5563']
  ]
};
const PALETTE = ['#22A06B','#F07C3A','#3B82F6','#8B5CF6','#EAB308','#06B6D4','#EC4899','#EF4444','#A855F7','#0D9488'];
const catList = type => BASE[type].map(([id, name, ic, color]) => ({id, name, ic, color, type})).concat((S.customCats || []).filter(c => c.type === type));
const catById = id => catList('gider').concat(catList('gelir')).find(c => c.id === id) || {id, name: 'Diğer', ic: '📦', color: '#6B7280', type: 'gider'};
const cs = c => `style="--c:${c.color}"`;

/* ================= starter templates ================= */
const PROFILES = {
  ogrenci: {name: 'Öğrenci', ic: '🎓', desc: 'Yurt/ev, yemek, ulaşım, okul', total: 20000,
    cats: {kira: 5500, yemek: 4500, market: 3000, ulasim: 1200, eglence: 1500, egitim: 1500, iletisim: 500, giyim: 1000},
    fixed: [['Yurt / ev payı', 'kira', 5500, 1], ['Telefon', 'iletisim', 400, 10], ['Müzik aboneliği', 'abonelik', 60, 15]],
    quick: [['Kahve', 'yemek', 90], ['Yemekhane', 'yemek', 60], ['Otobüs', 'ulasim', 27], ['Market', 'market', 0], ['Fotokopi', 'egitim', 0], ['Harçlık', 'digerg', 0, 'gelir']]},
  calisan: {name: 'Bekar çalışan', ic: '💼', desc: 'Kira, faturalar, dışarıda yemek', total: 40000,
    cats: {kira: 15900, iletisim: 1000, market: 6500, yemek: 5000, ulasim: 2500, fatura: 2200, eglence: 3000, giyim: 2000, abonelik: 500},
    fixed: [['Kira', 'kira', 15000, 1], ['Aidat', 'kira', 900, 5], ['Elektrik', 'fatura', 800, 12], ['Doğalgaz', 'fatura', 1100, 14], ['İnternet', 'iletisim', 450, 18], ['Telefon', 'iletisim', 550, 20], ['Netflix', 'abonelik', 230, 22], ['Spor salonu', 'eglence', 1200, 3]],
    quick: [['Kahve', 'yemek', 120], ['Öğle yemeği', 'yemek', 350], ['Metro', 'ulasim', 35], ['Market', 'market', 0], ['Taksi', 'ulasim', 0], ['Maaş', 'maas', 0, 'gelir']]},
  aile: {name: 'Aile', ic: '👨‍👩‍👧', desc: 'Ev, okul, çocuk, mutfak', total: 74000,
    cats: {kira: 23200, iletisim: 500, market: 15000, fatura: 5500, egitim: 6500, ulasim: 5000, saglik: 2000, giyim: 4000, eglence: 3000, kredi: 6000},
    fixed: [['Kira', 'kira', 22000, 1], ['Aidat', 'kira', 1200, 5], ['Elektrik', 'fatura', 1600, 12], ['Doğalgaz', 'fatura', 2200, 14], ['Su', 'fatura', 450, 16], ['İnternet', 'iletisim', 450, 18], ['Okul servisi', 'egitim', 3500, 2], ['Kredi taksiti', 'kredi', 6000, 25]],
    quick: [['Ekmek', 'market', 15], ['Market', 'market', 0], ['Pazar', 'market', 0], ['Akaryakıt', 'ulasim', 0], ['Eczane', 'saglik', 0], ['Maaş', 'maas', 0, 'gelir']]},
  serbest: {name: 'Serbest çalışan', ic: '🧑‍💻', desc: 'Değişken gelir, vergi, ofis', total: 46000,
    cats: {kira: 17000, market: 6000, yemek: 4000, ulasim: 2000, fatura: 2200, abonelik: 1500, kredi: 6500, diger: 6000, iletisim: 500},
    fixed: [['Kira', 'kira', 17000, 1], ['Bağ-Kur primi', 'kredi', 6500, 20], ['Muhasebeci', 'diger', 2500, 10], ['Cowork üyeliği', 'diger', 3000, 1], ['İnternet', 'iletisim', 450, 18], ['Yazılım abonelikleri', 'abonelik', 900, 5]],
    quick: [['Kahve', 'yemek', 120], ['Yemek', 'yemek', 350], ['Taksi', 'ulasim', 0], ['Market', 'market', 0], ['Proje ödemesi', 'ek', 0, 'gelir']]}
};
function applyProfile(s, key) {
  const p = PROFILES[key];
  s.profile = key;
  s.budgets = {total: p.total, cats: {...p.cats}};
  s.fixed = p.fixed.map(([name, cat, amount, day]) => ({id: uid(), name, cat, amount, day, type: 'gider'}));
  s.quick = p.quick.map(([name, cat, amount, type]) => ({id: uid(), name, cat, amount, type: type || 'gider'}));
}
const blank = () => ({v: 2, tx: [], budgets: {total: 0, cats: {}}, fixed: [], quick: [], customCats: [], goals: [], profile: null, sample: false});

/* ================= sample data ================= */
function makeSample() {
  const s = blank(); applyProfile(s, 'calisan'); s.sample = true;
  let seed = 20260928; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(r() * a.length)];
  const now = new Date();
  const g1 = {id: uid(), name: 'Yaz tatili', ic: '🏖️', target: 40000, deadline: mkey(now.getFullYear() + 1, 5), color: '#06B6D4', deposits: [], s: 1};
  const g2 = {id: uid(), name: 'Acil durum fonu', ic: '🛟', target: 60000, deadline: '', color: '#8B5CF6', deposits: [], s: 1};
  for (let k = 5; k >= 0; k--) {
    const d0 = new Date(now.getFullYear(), now.getMonth() - k, 1), y = d0.getFullYear(), m = d0.getMonth();
    const last = k === 0 ? now.getDate() : daysIn(y, m);
    const add = (day, type, cat, amount, note, extra) => {
      if (day > last) return;
      s.tx.push({id: uid(), type, cat, amount: Math.round(amount / 5) * 5, note, date: `${y}-${pad(m + 1)}-${pad(day)}`, method: r() < .8 ? 'kart' : 'nakit', s: 1, ...extra});
    };
    add(1, 'gelir', 'maas', 52000, 'Maaş');
    if (r() < .5) add(10 + Math.floor(r() * 12), 'gelir', 'ek', 3000 + Math.round(r() * 40) * 100, 'Serbest proje');
    s.fixed.forEach(f => add(Math.min(f.day, daysIn(y, m)), 'gider', f.cat, f.amount * (f.cat === 'fatura' ? .8 + r() * .5 : 1), f.name, {fixedId: f.id}));
    for (let day = 1; day <= last; day++) {
      if (r() < .33) add(day, 'gider', 'market', 250 + r() * 1100, pick(['Migros', 'A101', 'BİM', 'Şok', 'Pazar']));
      if (r() < .45) add(day, 'gider', 'yemek', 110 + r() * 480, pick(['Kahve', 'Öğle yemeği', 'Akşam yemeği', 'Döner', 'Kahve']));
      if (r() < .3) add(day, 'gider', 'ulasim', 35 + r() * 280, pick(['Metro', 'Taksi', 'Otobüs', 'Akaryakıt']));
      if (r() < .05) add(day, 'gider', 'giyim', 600 + r() * 2400, pick(['Tişört', 'Ayakkabı', 'Mont']));
      if (r() < .07) add(day, 'gider', 'eglence', 300 + r() * 1200, pick(['Sinema', 'Konser', 'Maç bileti', 'Kitap']));
      if (r() < .04) add(day, 'gider', 'saglik', 150 + r() * 900, 'Eczane');
      if (r() < .03) add(day, 'gider', 'kisisel', 300 + r() * 600, 'Berber');
    }
    const dd = `${y}-${pad(m + 1)}-${pad(Math.min(2, last))}`;
    g1.deposits.push({id: uid(), date: dd, amount: 3000}); g2.deposits.push({id: uid(), date: dd, amount: 4000});
  }
  const start = addMonths(todayStr(), -3), g = uid();
  for (let i = 0; i < 6; i++) s.tx.push({id: uid(), type: 'gider', cat: 'iletisim', amount: 4000, note: 'Telefon', date: addMonths(start, i), method: 'kart', s: 1, inst: {g, i: i + 1, n: 6, total: 24000}});
  s.goals = [g1, g2];
  return s;
}

/* ================= storage ================= */
const KEY = 'kese.v1';
let S;
function load() { try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* keep in memory */ } }
function loadUi() { try { return JSON.parse(localStorage.getItem(KEY + '.ui')) || {}; } catch (e) { return {}; } }
function saveUi() { try { localStorage.setItem(KEY + '.ui', JSON.stringify({view})); } catch (e) {} }
S = load();
if (!S || !Array.isArray(S.tx)) S = makeSample();
S.customCats = S.customCats || []; S.budgets = S.budgets || {total: 0, cats: {}}; S.budgets.cats = S.budgets.cats || {};
S.goals = S.goals || []; S.fixed = S.fixed || []; S.quick = S.quick || []; S.v = 2;
S.customCats.forEach((c, i) => { if (!c.color) c.color = PALETTE[i % PALETTE.length]; });

/* ================= state ================= */
const now0 = new Date();
let cur = {y: now0.getFullYear(), m: now0.getMonth()};
const VIEWS = ['ozet', 'hareketler', 'butce', 'hedefler', 'ayarlar'];
let view = location.hash.slice(1) || loadUi().view || 'ozet';
if (!VIEWS.includes(view)) view = 'ozet';
let listFilter = {q: '', type: 'all', cat: ''};
let showAllCats = false;

const monthTx = (y, m) => { const k = mkey(y, m); return S.tx.filter(t => t.date.slice(0, 7) === k); };
const sum = (arr, type) => arr.reduce((a, t) => a + (!type || t.type === type ? t.amount : 0), 0);
const isCurMonth = () => cur.y === now0.getFullYear() && cur.m === now0.getMonth();
const defaultDate = () => isCurMonth() ? todayStr() : `${cur.y}-${pad(cur.m + 1)}-${pad(Math.min(now0.getDate(), daysIn(cur.y, cur.m)))}`;
const goalSaved = g => g.deposits.reduce((a, d) => a + d.amount, 0);
const monthSaved = (y, m) => { const k = mkey(y, m); return S.goals.reduce((a, g) => a + g.deposits.filter(d => d.date.slice(0, 7) === k).reduce((x, d) => x + d.amount, 0), 0); };
function streak() {
  const days = new Set(S.tx.map(t => t.date));
  const d = new Date(); if (!days.has(dstr(d))) d.setDate(d.getDate() - 1);
  let n = 0; while (days.has(dstr(d)) && n < 999) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function ring(pct, color, size = 72, stroke = 9, label = '') {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct));
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${stroke}"/>${p > 0 ? `<circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c * p} ${c}"/>` : ''}</svg><span style="font-size:${Math.round(size * .2)}px">${label}</span></div>`;
}

/* ================= frame ================= */
function render(animate) {
  $('#mLabel').textContent = `${AY[cur.m]} ${cur.y}`;
  $$('.nav a').forEach(a => a.setAttribute('aria-current', a.dataset.v === view ? 'page' : 'false'));
  $('#gear').setAttribute('aria-pressed', view === 'ayarlar');
  const v = $('#view');
  ({ozet: renderOzet, hareketler: renderList, butce: renderBudget, hedefler: renderGoals, ayarlar: renderSettings})[view](v);
  if (animate) { v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter'); }
}
function go(v) { if (v !== view) buzz(5); view = v; saveUi(); if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v); render(true); window.scrollTo(0, 0); }

/* ================= ÖZET ================= */
function renderOzet(el) {
  const txs = monthTx(cur.y, cur.m);
  const inc = sum(txs, 'gelir'), exp = sum(txs, 'gider'), sav = monthSaved(cur.y, cur.m), left = inc - exp - sav;
  const pm = new Date(cur.y, cur.m - 1, 1), ptx = monthTx(pm.getFullYear(), pm.getMonth());
  const dim = daysIn(cur.y, cur.m), elapsed = isCurMonth() ? now0.getDate() : dim;

    <button class="qchip add" data-act="newQuick">+ Şablon</button></div></section>`;

  const B = S.budgets.total || 0;
  if (B > 0) {

    const stt = exp > B ? ['bad', 'Bütçe aşıldı'] : p > .85 ? ['warn', 'Sınıra yakın'] : ['good', 'Yolunda'];
    h += `<section class="card ringcard" data-go="butce" role="button" tabindex="0">
      ${ring(p, `var(--${stt[0] === 'good' ? 'accent' : stt[0]})`, 78, 10, '%' + Math.round(p * 100))}
      <div><div class="row" style="justify-content:space-between"><span class="eyebrow">Bütçe</span><span class="pill ${stt[0]}">${stt[1]}</span></div>

        : `<div class="v num">${money(Math.abs(bl))}</div><div class="s">${bl >= 0 ? 'bütçeden arta kaldı' : 'bütçe aşıldı'}</div>`}
      <div class="s num">${money(exp)} / ${money(B)}</div></div></section>`;
  }

  if (S.goals.length) {
    h += `<section aria-label="Birikim hedefleri"><div class="sec-h"><h2>Hedefler</h2><button class="linkbtn" data-go="hedefler">Tümü</button></div><div class="chips">
      ${S.goals.map(g => { const sv = goalSaved(g), p = Math.min(1, sv / g.target); return `<button class="gmini" style="--c:${g.color}" data-gdep="${g.id}">
        <div class="top2"><span style="font-size:24px">${esc(g.ic)}</span><span class="pill mute" style="background:var(--surface)">%${Math.round(p * 100)}</span></div>

      <button class="qchip add" data-act="newGoal" style="min-width:110px">+ Hedef</button></div></section>`;
  }

  if (S.fixed.length) {

    </section>`;
  }

  const endKey = mkey(cur.y, cur.m), nd = new Date(cur.y, cur.m + 1, 1), nk = mkey(nd.getFullYear(), nd.getMonth());
  const insts = S.tx.filter(t => t.inst);
  if (insts.some(t => t.date.slice(0, 7) >= endKey)) {
    const thisM = sum(insts.filter(t => t.date.slice(0, 7) === endKey)), nextM = sum(insts.filter(t => t.date.slice(0, 7) === nk)), rest = sum(insts.filter(t => t.date.slice(0, 7) > endKey));
    const groups = new Set(insts.filter(t => t.date.slice(0, 7) > endKey).map(t => t.inst.g));
    h += `<section class="card"><div class="sec-h"><h2>Taksitler</h2><span class="sub">${groups.size} devam eden alım</span></div>

      <p class="hint num" style="margin-top:10px">Önümüzdeki aylara toplam ${money(rest)} taksit yükü var.</p></section>`;
  }

  const ending = !isCurMonth() || dim - now0.getDate() <= 3;
  h += `<button class="cta" data-act="report"><span class="ic">${ending ? '📊' : '🔍'}</span><span><b>${AY[cur.m]} raporu${ending ? ' hazır' : ''}</b><small>${ending ? 'Nereye harcadın, ne değişti, gelecek ay için öneriler' : 'Ay bitmedi; şu ana kadarki tablo ve öneriler'}</small></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>`;

  const byCat = {};
  txs.filter(t => t.type === 'gider').forEach(t => byCat[t.cat] = (byCat[t.cat] || 0) + t.amount);
  const rows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const shown = showAllCats ? rows : rows.slice(0, 6);
  h += `<section><div class="sec-h"><h2>Nereye gitti?</h2><span class="sub">dokun, hareketleri gör</span></div>
    ${rows.length ? `<div class="cgrid">${shown.map(([k, v]) => { const c = catById(k), b = S.budgets.cats[k] || 0;
      const stt = b ? (v > b ? 'bad' : v > b * .85 ? 'warn' : 'good') : null;

        <div class="n">${esc(c.name)}</div><div class="a num">${money(v)}</div>
        <div class="bar"><i style="width:${b ? Math.min(100, v / b * 100) : v / rows[0][1] * 100}%;background:${stt && stt !== 'good' ? `var(--${stt})` : 'var(--c)'}"></i></div>
        ${b ? `<div class="bl num"><span>${v <= b ? money(b - v) + ' kaldı' : money(v - b) + ' aşıldı'}</span><span>/ ${money(b)}</span></div>` : ''}
      </button>`; }).join('')}
      ${rows.length > 6 ? `<button class="btn more" data-act="toggleCats">${showAllCats ? 'Daha az göster' : `Tümünü göster (${rows.length})`}</button>` : ''}</div>`
    : `<div class="card empty">Bu ay henüz harcama yok. Yukarıya “kahve 120” yaz ya da + düğmesine bas.</div>`}
  </section>`;

  h += `<section class="card"><div class="sec-h"><h2>Günlük harcama</h2><span class="sub num">ort. ${money(sum(txs.filter(t => !t.fixedId && !t.inst), 'gider') / Math.max(1, elapsed))}/gün</span></div>

  el.innerHTML = h;

}
function profileGrid() {

/* ================= quick text (typing / voice) ================= */
const GELIR_RE = /(maaş|maas|gelir|prim|ikramiye|harçlık|harclik|avans|temettü|burs|proje ödemesi)/;
const FILLER = new Set(['için','harcadım','ödedim','aldım','verdim','yaptım','tl','lira','₺','bir','de','da','ile','olarak']);
const AYLOW = AY.map(a => trLow(a));
const GUNLOW = GUN.map(g => trLow(g));
function parseQuick(text) {
  const raw = String(text || '').trim();
  let s = ' ' + trLow(raw).replace(/₺/g, ' ₺ ').replace(/(\d)(tl|lira)\b/g, '$1 ') + ' ';
  const now = new Date(), r = {amount: 0, type: raw.startsWith('+') ? 'gelir' : 'gider', date: todayStr(), dateLabel: 'Bugün', method: null, inst: 1, note: '', cat: null};
  s = s.replace(/^\s\+/, ' ');
  const cut = m => { s = s.replace(m, ' '); };
  const setD = (d, label) => { r.date = dstr(d); r.dateLabel = label; };
  let m;
  if ((m = s.match(/\s(\d{1,2})\s*(taksit|taksitle|ay taksit)\s/))) { r.inst = Math.min(36, Math.max(1, +m[1])); cut(m[0]); }
  if ((m = s.match(/\s(nakit|elden)\s/))) { r.method = 'nakit'; cut(m[0]); }
  if ((m = s.match(/\s(kredi kartıyla|kredi kartı|kartla|kart)\s/))) { r.method = 'kart'; cut(m[0]); }
  if ((m = s.match(/\s(evvelsi gün|önceki gün)\s/))) { setD(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 2), 'Önceki gün'); cut(m[0]); }
  else if ((m = s.match(/\s(dün|dun)\s/))) { setD(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1), 'Dün'); cut(m[0]); }
  else if ((m = s.match(/\s(bugün|bugun)\s/))) cut(m[0]);
  else if ((m = s.match(/\s(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{2,4}))?\s/)) && +m[2] >= 1 && +m[2] <= 12 && +m[1] >= 1 && +m[1] <= 31) {
    const y = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : now.getFullYear();
    setD(new Date(y, +m[2] - 1, Math.min(+m[1], daysIn(y, +m[2] - 1))), `${+m[1]} ${AY[+m[2] - 1]}`); cut(m[0]);
  }
  else if ((m = s.match(new RegExp('\\s(\\d{1,2})\\s(' + AYLOW.join('|') + ')\\s'))) && +m[1] >= 1 && +m[1] <= 31) {
    const mi = AYLOW.indexOf(m[2]); setD(new Date(now.getFullYear(), mi, Math.min(+m[1], daysIn(now.getFullYear(), mi))), `${+m[1]} ${AY[mi]}`); cut(m[0]);
  }
  else if ((m = s.match(/\s(geçen\s)?(pazartesi|salı|çarşamba|perşembe|cuma|cumartesi|pazar günü)\s/))) {
    const idx = GUNLOW.indexOf(m[2].replace(' günü', '')); let diff = (now.getDay() - idx + 7) % 7; if (m[1] && diff === 0) diff = 7;
    setD(new Date(now.getFullYear(), now.getMonth(), now.getDate() - diff), diff === 0 ? 'Bugün' : GUN[idx]); cut(m[0]);
  }
  if ((m = s.match(/\s(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:,\d{1,2})?|\d+\.\d{1,2})\s*(bin|k)?(?=\s)/))) {
    r.amount = Math.round(parseAmount(m[1]) * (m[2] ? 1000 : 1) * 100) / 100; cut(m[0]);
  }
  const words = s.split(/\s+/).filter(w => w && !FILLER.has(w));
  r.note = cap(words.join(' '));
  const ln = trLow(r.note);
  if (GELIR_RE.test(ln)) r.type = 'gelir';
  const own = catList(r.type).concat(catList(r.type === 'gelir' ? 'gider' : 'gelir'));
  let c = ln && own.find(c => ln.includes(trLow(c.name)) || trLow(c.name).split(/[ &-]/).some(w => w.length >= 4 && ln.includes(w)));
  if (!c && ln) { const prev = [...S.tx].reverse().find(t => t.note && trLow(t.note) === ln); if (prev) c = catById(prev.cat); }
  if (!c && ln) c = guessCat(ln, r.type);
  if (c) { if (c.type !== r.type && c.type === 'gelir') r.type = 'gelir'; if (c.type === r.type) r.cat = c.id; }
  if (r.type === 'gelir') r.inst = 1;
  return r;
}
function wireQuickText() {
  const inp = $('#qtext'); if (!inp) return;
  const prev = $('#qprev'), help = $('#qhelp');
  const paint = () => {
    const v = inp.value.trim();
    help.hidden = !!v;
    if (!v) { prev.innerHTML = ''; return; }
    const p = parseQuick(v), c = p.cat ? catById(p.cat) : null;
    prev.innerHTML = `${p.amount ? `<span class="tag amt num">${p.type === 'gelir' ? '+' : ''}${money(p.amount)}${p.inst > 1 ? ` · ${p.inst}×${money(p.amount / p.inst)}` : ''}</span>` : '<span class="tag" style="color:var(--bad)">tutar yaz</span>'}

}

const KW = [[/migros|a101|bim|şok|carrefour|market|pazar|bakkal|manav|kasap|ekmek|fırın/, 'market'], [/kahve|cafe|kafe|yemek|restoran|döner|pizza|burger|starbucks|yemeksepeti|kahvaltı|tatlı|simit/, 'yemek'],
  [/metro|otobüs|taksi|uber|benzin|akaryakıt|mazot|istanbulkart|otopark|köprü|hgs|ogs|bilet|dolmuş|marmaray/, 'ulasim'], [/kira|aidat/, 'kira'], [/elektrik|doğalgaz|dogalgaz|su faturası|fatura/, 'fatura'],
  [/internet|turkcell|vodafone|türk telekom|superonline/, 'iletisim'], [/netflix|spotify|youtube|disney|abonelik|icloud|prime|exxen|blutv/, 'abonelik'], [/eczane|doktor|hastane|ilaç|diş/, 'saglik'],
  [/giyim|tişört|ayakkabı|mont|pantolon|zara|lcw|koton|defacto|elbise/, 'giyim'], [/sinema|konser|oyun|maç|tiyatro/, 'eglence'], [/berber|kuaför|kozmetik|parfüm/, 'kisisel'], [/kredi|taksit|borç|kart borcu/, 'kredi'],
  [/okul|kurs|kitap|kırtasiye/, 'egitim'], [/mama|veteriner|kedi|köpek/, 'evcil'], [/hediye|doğum günü/, 'hediye'], [/mobilya|ikea|koçtaş|beyaz eşya/, 'ev'], [/maaş/, 'maas'], [/prim|ikramiye/, 'prim']];
function guessCat(text, type) {
  const t = trLow(text);
  const all = catList(type === 'gelir' ? 'gelir' : 'gider').concat(catList(type === 'gelir' ? 'gider' : 'gelir'));
  const exact = all.find(c => trLow(c.name) === t || c.id === t || trLow(c.name).split(/[ &]/)[0] === t);
  if (exact) return exact;
  for (const [re, id] of KW) if (re.test(t)) return catById(id);
  return null;
}
function parseAmount(s) {
  s = String(s).replace(/[₺\s]|tl/gi, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return parseFloat(s);
}
function parseDate(s) {
  s = String(s).trim(); let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  if ((m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/))) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }
  return null;
}
function splitLine(line, d) {
  const out = []; let cell = '', q = false;
  for (let i = 0; i < line.length; i++) { const ch = line[i];
    if (q) { if (ch === '"' && line[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; }
    else if (ch === '"') q = true; else if (ch === d) { out.push(cell); cell = ''; } else cell += ch; }
  out.push(cell); return out.map(c => c.trim());
}
function doImport(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n').filter(l => l.trim()), msg = $('#impMsg');
  if (!lines.length) { msg.textContent = 'Yapıştırılmış satır bulunamadı.'; return; }
  const d = lines[0].includes('\t') ? '\t' : (lines[0].split(';').length > lines[0].split(',').length ? ';' : ',');
  let rows = lines.map(l => splitLine(l, d)), idx = {date: 0, note: 1, amount: 2, cat: 3, type: -1};
  const head = rows[0].map(trLow);
  if (!parseDate(rows[0][0]) && head.some(h => /tarih|date|tutar|amount/.test(h))) {
    const f = re => head.findIndex(h => re.test(h));
    idx = {date: f(/tarih|date/), note: f(/açıklama|aciklama|not|description|detay|harcama/), amount: f(/tutar|amount|miktar|fiyat/), cat: f(/kategori|category/), type: f(/^tür|^tur|^tip|type/)};
    rows = rows.slice(1);
  }
  let ok = 0, bad = 0; const added = [];
  rows.forEach(r => {
    const date = parseDate(r[idx.date] || ''), amount = parseAmount(r[idx.amount] ?? '');
    if (!date || !isFinite(amount) || amount === 0) { bad++; return; }
    const note = idx.note >= 0 ? (r[idx.note] || '') : '';
    let type = idx.type >= 0 && /gelir|income/.test(trLow(r[idx.type])) ? 'gelir' : 'gider';
    const c = guessCat((idx.cat >= 0 && r[idx.cat]) || note, type) || guessCat(note, type);
    if (idx.type < 0 && c && c.type === 'gelir') type = 'gelir';
    const cat = c && c.type === type ? c.id : (type === 'gelir' ? 'digerg' : 'diger');
    const t = {id: uid(), type, cat, amount: Math.abs(amount), note: note.slice(0, 60), date, method: 'kart', ts: Date.now()};
    S.tx.push(t); added.push(t.id); ok++;
  });
  save();
  msg.textContent = `${ok} kayıt eklendi${bad ? `, ${bad} satır okunamadı (tarih veya tutar eksik)` : ''}.`;
  if (ok) { const ta = $('#impText'); if (ta) ta.value = ''; toast(`${ok} kayıt içe aktarıldı`, undoIds(added)); }
}
function csvText(sep) {
  const q = v => { v = String(v ?? ''); return /[;\t",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const rows = [['Tarih', 'Tür', 'Kategori', 'Açıklama', 'Tutar', 'Ödeme', 'Taksit']];
  [...S.tx].sort((a, b) => a.date.localeCompare(b.date)).forEach(t => { const [y, m, d] = t.date.split('-');
    rows.push([`${d}.${m}.${y}`, t.type === 'gelir' ? 'Gelir' : 'Gider', catById(t.cat).name, t.note || '', String(t.amount).replace('.', ','), t.method === 'nakit' ? 'Nakit' : 'Kart', t.inst ? `${t.inst.i}/${t.inst.n}` : '']); });
  return rows.map(r => r.map(q).join(sep)).join('\n');
}
function download(name, text, mime) {
  try { const blob = new Blob(['﻿' + text], {type: mime}), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('İndirme başlatıldı'); }
  catch (e) { toast('İndirme engellendi. “Kopyala” seçeneğini kullan.'); }
}
function copyOut(text, label) {
  const box = $('#copyBox');
  const fallback = () => { box.hidden = false; box.value = text; box.focus(); box.select(); toast('Metin seçildi, elle kopyalayabilirsin.'); };
  try { navigator.clipboard.writeText(text).then(() => toast(label + ' panoya kopyalandı'), fallback); } catch (e) { fallback(); }
}
function restore(txt) {
  try { const d = JSON.parse(txt); if (!Array.isArray(d.tx)) throw 0;
    ask('Yedek geri yüklensin mi?', `Yedekte ${d.tx.length} kayıt var. Bu cihazdaki veriler yedeğin içeriğiyle değişecek.`, 'Geri yükle', () => { S = Object.assign(blank(), d); S.goals = S.goals || []; save(); render(); toast('Yedek geri yüklendi'); });

function paintAmt() {

function key(k) {

/* ================= generic modal ================= */
const modal = $('#modal'), mForm = $('#mForm');

const grabHtml = title => `<div class="grabzone"><div class="grab"></div><div class="sheet-h"><h2>${esc(title)}</h2><button type="button" class="x" data-mclose aria-label="Kapat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>`;
function ask(title, text, okLabel, fn, alt) {
  openModal(`${grabHtml(title)}<p class="hint" style="font-size:14.5px;color:var(--ink-2)">${esc(text)}</p>
    <div class="save-row" style="flex-wrap:wrap">${alt ? `<button type="button" class="btn" id="mAlt" style="flex:1">${esc(alt.label)}</button>` : `<button type="button" class="btn" data-mclose style="flex:1">Vazgeç</button>`}<button class="save" style="flex:1;min-width:150px">${esc(okLabel)}</button></div>`);

function formModal(title, fields, vals, onSave, onDelete) {

      f.t === 'type' ? `<select class="inp" id="f_${f.k}"><option value="gider" ${vals[f.k] !== 'gelir' ? 'selected' : ''}>Gider</option><option value="gelir" ${vals[f.k] === 'gelir' ? 'selected' : ''}>Gelir</option></select>` :

      `<input class="inp" id="f_${f.k}" ${f.t === 'num' ? 'inputmode="decimal"' : ''} value="${esc(vals[f.k] ?? '')}" placeholder="${esc(f.ph || '')}" maxlength="${f.max || 60}">`}</label>`).join('')}
    <div class="err" id="mErr"></div>
    <div class="save-row">${onDelete ? '<button type="button" class="btn danger" id="mDel">Sil</button>' : ''}<button class="save">Kaydet</button></div>`);
  const ty = $('#f_type', mForm), ca = $('#f_cat', mForm);

  };
  const first = $('input', mForm); if (first && !first.value) setTimeout(() => first.focus(), 250);

function editFixed(f) {

      if (f) Object.assign(f, {name: v.name, amount: v.amount, day, cat: v.cat}); else S.fixed.push({id: uid(), type: 'gider', name: v.name, amount: v.amount, day, cat: v.cat}); save(); render(); },

/* drag down to close sheets */
function draggable(panel, close) {
  let d = null;
  panel.addEventListener('pointerdown', e => { const z = e.target.closest('.grabzone'); if (!z || e.target.closest('button')) return; d = {y: e.clientY, dy: 0, id: e.pointerId}; panel.style.transition = 'none'; });
  panel.addEventListener('pointermove', e => { if (!d) return; d.dy = Math.max(0, e.clientY - d.y); if (d.dy > 4 && !d.cap) { d.cap = true; try { panel.setPointerCapture(d.id); } catch (x) {} } panel.style.transform = d.dy ? `translateY(${d.dy}px)` : ''; });
  const up = () => { if (!d) return; const dy = d.dy; d = null; panel.style.transition = 'transform .22s'; if (dy > 110) { panel.style.transform = 'translateY(100%)'; setTimeout(() => { close(); panel.style.transition = ''; panel.style.transform = ''; }, 200); } else { panel.style.transform = ''; setTimeout(() => { panel.style.transition = ''; }, 230); } };
  panel.addEventListener('pointerup', up); panel.addEventListener('pointercancel', up);
}

function addQuick(q) {

document.addEventListener('click', e => {

/* ================= toast ================= */
let toastT;
function toast(msg, action) {
  const el = $('#toast'); clearTimeout(toastT);
  el.hidden = true; void el.offsetWidth;
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
  el.hidden = false;
  if (action) el.querySelector('button').onclick = () => { action.fn(); el.hidden = true; buzz(8); };
  toastT = setTimeout(() => { el.hidden = true; }, action ? 5000 : 3000);
}
